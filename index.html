<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mapa de Share KA Ceará</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra de controle fixa no topo; Preencher = lista de clientes + ficha do cliente; Consolidado = KPIs + tabelas de oportunidade */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f9fafb; --ink:#13202b; --muted:#5a6876; --line:#dde3e9;
  --accent:#0d5d7d; --accent-ink:#ffffff; --accent-soft:#e2eff5;
  --good:#1d7a4c; --good-soft:#e3f3ea; --warn:#a96400; --warn-soft:#fbf0dd; --bad:#b0281f; --bad-soft:#fbe7e5;
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1a232c; --ink:#e5ebf0; --muted:#94a2b0; --line:#28333e;
  --accent:#5db3d4; --accent-ink:#06202b; --accent-soft:#163240;
  --good:#4fc48d; --good-soft:#15301f; --warn:#e3a63c; --warn-soft:#33270f; --bad:#f2786d; --bad-soft:#3a1a18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1a232c; --ink:#e5ebf0; --muted:#94a2b0; --line:#28333e;
  --accent:#5db3d4; --accent-ink:#06202b; --accent-soft:#163240;
  --good:#4fc48d; --good-soft:#15301f; --warn:#e3a63c; --warn-soft:#33270f; --bad:#f2786d; --bad-soft:#3a1a18;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num,.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;margin-right:auto}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.status[data-s="saving"] .dot{background:var(--warn)}
.status[data-s="error"] .dot,.status[data-s="off"] .dot{background:var(--bad)}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:13px;border:1px solid var(--line)}
main{padding-block:16px 48px}
/* PREENCHER */
.fill{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);display:flex;flex-direction:column;min-width:0}
.list-head{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list-head input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.list-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.list ul{list-style:none;margin:0;padding:4px;overflow-y:auto}
.cli{width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
.cli:hover{background:var(--surface-2)}
.cli[aria-current="true"]{background:var(--accent-soft)}
.cli .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .s{font-size:11.5px;color:var(--muted);grid-column:1}
.cli .p{grid-row:1/3;grid-column:2;align-self:center}
.ring{font-family:var(--font-num);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ring.part{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ring.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.panel{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chead{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start}
.chead .id{min-width:0;flex:1 1 280px}
.chead h2{margin:0;font-size:19px;letter-spacing:-.01em;text-wrap:balance}
.chead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px}
.fact{display:flex;flex-direction:column}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact .v{font-family:var(--font-num);font-weight:600;font-size:15px}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.howto{font-size:12.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(200px,1.3fr) repeat(4,minmax(0,1fr)) 74px minmax(150px,1fr);gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.grp{padding:8px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp + .row{border-top:0}
.row.nu{opacity:.62}
.item .in{font-weight:600}
.item .ir{font-size:11.5px;color:var(--muted)}
.item .ib{font-size:11.5px;margin-top:3px;color:var(--accent)}
.item .ib.none{color:var(--muted)}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.f input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);min-width:0}
.f input:focus{background:var(--surface);border-color:var(--accent)}
.f input:disabled{opacity:.6}
.f.n input{font-family:var(--font-num);text-align:right}
.nuc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.calc{font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.calc .pot{font-family:var(--font-num);font-weight:600}
.chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.rowhead{display:grid;grid-template-columns:minmax(200px,1.3fr) repeat(4,minmax(0,1fr)) 74px minmax(150px,1fr);gap:10px;padding:8px 16px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line)}
.rowhead + .rows .row:first-child{border-top:0}
/* CONSOLIDADO */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--font-num);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.sec{margin-top:20px}
.sec h3{margin:0 0 2px;font-size:15px}
.sec .lead{margin:0 0 10px;color:var(--muted);font-size:12.5px;max-width:80ch}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
td.r{font-family:var(--font-num);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--surface-2)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;min-width:2px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar p{margin:0;color:var(--muted);font-size:12.5px;max-width:90ch}
@media (max-width:1180px){
  .row,.rowhead{grid-template-columns:repeat(4,minmax(0,1fr))}
  .row .item{grid-column:1/-1}
  .row .calc{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center}
  .row .nuc{grid-column:1/-1}
  .rowhead{display:none}
}
@media (max-width:900px){
  .fill{grid-template-columns:minmax(0,1fr)}
  .list{position:static;max-height:300px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v2: filas de campos, faixa de preenchimento por KA, testes, visões ===== */
.row{display:block!important;padding:14px 16px;border-top:1px solid var(--line)}
.row .item{display:flex!important;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:4px 16px;margin-bottom:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-items:end}
.f select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);min-width:0;font:inherit;color:inherit}
.f select:focus{border-color:var(--accent);background:var(--surface)}
.row .calc{margin-top:10px;display:flex!important;flex-direction:row!important;flex-wrap:wrap;gap:6px 14px;align-items:center}
.btn.sm{padding:3px 10px;font-size:12px}
.kastrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.kac{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.kac[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kac .kn{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kac .kp{font-family:var(--font-num);font-size:20px;font-weight:600;line-height:1.1}
.kac .kd{font-size:11.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:14px 16px;align-items:end}
.grid-form .wide{grid-column:span 2}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.agendado{background:var(--accent-soft);color:var(--accent)}
.pill.realizado{background:var(--warn-soft);color:var(--warn)}
.pill.aprovado{background:var(--good-soft);color:var(--good)}
.pill.reprovado,.pill.cancelado{background:var(--bad-soft);color:var(--bad)}
td select,td input{font:inherit;color:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
td.wrap{white-space:normal;min-width:180px}
.subtle{font-size:11.5px;color:var(--muted)}
.itemsec{margin-top:18px}
.itemhead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:8px}
.itemhead h3{margin:0;font-size:15px}
.mini{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.mini b{color:var(--ink);font-family:var(--font-num)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.gate .box{max-width:400px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.gate h2{margin:0;font-size:20px}.gate p{margin:0;color:var(--muted);font-size:13.5px}
.gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font:inherit;color:inherit}
.gate .btn{justify-content:center;padding:10px 14px}
.gate .or{text-align:center;font-size:12px;color:var(--muted)}
.gate .msg{font-size:13px;color:var(--accent)}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px;vertical-align:middle}
.spark i{display:block;width:7px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.auto{font-size:12.5px;padding:8px 10px;border-radius:6px;background:var(--good-soft);color:var(--ink);flex:1 1 100%}
.auto b{color:var(--good)}
.mapmsg{font-size:12.5px;padding:10px 12px;border-radius:6px;background:var(--bad-soft);color:var(--ink);margin-bottom:10px}
.mapmsg b{color:var(--bad)}
.tipline{font-size:11.5px;margin-top:3px;color:var(--muted)}
.tipline b{color:var(--ink);font-family:var(--font-num)}
.checks{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.jcbox{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.jcbox .f{flex:1 1 260px}
@media (max-width:900px){.kastrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kastrip{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-form .wide{grid-column:auto}.kac .kp{font-size:17px}}
</style>

<script>
/* ===== Base (Metabase, 28/10/2026): top 30 por receita média 3m de cada KA no CE; compras na Praso = média mensal dos últimos 90 dias, todas as variações do item somadas ===== */
const KAS={icaroka:"Ícaro",vitorka:"Vitor",marioka:"Mário",ioneideka:"Ioneide"};
const KA_ORDER=["icaroka","vitorka","marioka","ioneideka"];
const BUYERS=["Tereza","Diogo","João Neto","José Felipe"];
// 12 itens = 3 por comprador. price = R$ por unidade de medida (kg, L ou lata) da referência. pb = marcas que a Praso tem no CE
const SKUS=[
 {code:"chocolate",buyer:0,nome:"Barra de chocolate / cobertura",var:"barra, fracionada ou gotas",ref:"Garoto ao leite · barra 2,1 kg",u:"kg",price:66.66,pb:["Garoto","Melken Harald","Sicao","Galak","Selecta","TOP Harald","Confeiteiro Harald"]},
 {code:"creme_leite",buyer:0,nome:"Creme de leite",var:"caixinha, lata ou 1 kg",ref:"Cemil 20% · caixinha 200 g",u:"kg",price:18.45,pb:["Cemil","Italac","CCGL","Natville","Nestlé","Itambé","Betânia"]},
 {code:"leite_cond",buyer:0,nome:"Leite condensado",var:"caixinha, lata ou bag",ref:"CCGL · caixinha 395 g",u:"kg",price:17.70,pb:["CCGL","Natville","Cemil","Itambé","Italac","Betânia","Moça"]},

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/R\$\s?/,"");if(!s)return NaN;

function trRow(cid,i){return (TR[cid]||[]).find(x=>x[0]===i)||null;}
function prasoBuy(cid,i){const b=trRow(cid,i);if(!b)return null;const vol=(b[2]+b[3]+b[4])/3;if(!vol||!b[5])return null;return{vol,pkg:b[5]};}
function trend(cid,i){const b=trRow(cid,i);if(!b)return null;const v=[b[1],b[2],b[3],b[4]];const tot=v.reduce((x,y)=>x+y,0);if(!tot)return null;
  const a=(v[0]+v[1])/2, z=(v[2]+v[3])/2;let k,l,ch=null;
  if(v[3]===0&&v[2]===0){k="forte";l="Parou de comprar há mais de 30 dias";ch=-1;}
  else if(v[3]===0){k="forte";l="Sem compra nos últimos 30 dias";ch=-1;}
  else if(a===0){k="alta";l="Começou a comprar";}
  else{ch=(z-a)/a;if(ch>0.15){k="alta";l=`Em alta (+${fmtN(ch*100,0)}%)`;}else if(ch< -0.20){k="forte";l=`Queda forte (${fmtN(ch*100,0)}%)`;}else if(ch< -0.05){k="queda";l=`Queda leve (${fmtN(ch*100,0)}%)`;}else{k="const";l="Estável";}}
  return{v,k,l,ch};}
const jcDrop=(cid,i)=>trend(cid,i)?.k==="forte";
function trendHtml(cid,i,compact){const t=trend(cid,i);if(!t)return compact?"":`<span class="chip neu">Sem compra na Praso nos últimos 120 dias</span>`;
  const mx=Math.max(...t.v,1);const lab=["4º","3º","2º","último"];
  const bars=`<span class="spark" title="Volume por janela de 30 dias, do mais antigo ao mais recente">${t.v.map(x=>`<i style="height:${Math.max(2,Math.round(x/mx*22))}px"></i>`).join("")}</span>`;
  const cls=t.k==="alta"?"good":t.k==="forte"?"bad":t.k==="queda"?"warn":"neu";
  if(compact)return `<span class="chip ${cls}">${esc(t.l)}</span>`;
  return `${bars}<span class="chip ${cls}">${esc(t.l)}</span><span class="subtle">Últimos 4 meses (30 em 30 dias): ${t.v.map(x=>fmtVol(x,i)).join(" → ")}</span>`;}

  const bought=new Set(cbv&&cbv[0]===tip?String(cbv[1]).split(",").filter(Boolean).map(Number):[]);

function calc(cid,i){

  const nu=!!e.nu||(!!e.jc&&!jcDrop(cid,i)), hasVol=peso>0&&qtd>0, hasPreco=preco>0&&peso>0;
  const volPraso=pb?pb.vol:0;

  const refP=pb?pb.pkg:tablePkg(i);

  return{e,pb,peso,qtd,preco,nu,hasVol,precoU,volPraso,volFora,volTot:volFora+volPraso,refP,pot,diff,filled:nu||hasVol,troca:nu?"":(e.troca||"")};

/* ===== Persistência ===== */
const timers={}, saving={};
let errState=false, dbTried=false, tSaving=0;
function setStatus(){
  const el=document.getElementById("status"),t=document.getElementById("statusTxt");
  if(!db){el.dataset.s="off";t.textContent=dbTried?"Sem salvamento":"Conectando…";return;}
  if(errState){el.dataset.s="error";t.textContent="Erro ao salvar. Tente de novo";return;}
  if(dirty.size||tSaving||Object.values(saving).some(Boolean)){el.dataset.s="saving";t.textContent="Salvando…";return;}
  el.dataset.s="ok";t.textContent="Tudo salvo";
}
function scheduleSave(cid){dirty.add(cid);setStatus();clearTimeout(timers[cid]);timers[cid]=setTimeout(()=>flush(cid),800);}
function readOnly(){canWrite=false;showNotice("Seu acesso a este painel é só de leitura. Entre com um e-mail @praso.com.br para preencher.");}
async function flush(cid){
  if(!db||!canWrite)return;
  if(saving[cid]){timers[cid]=setTimeout(()=>flush(cid),400);return;}
  saving[cid]=true;dirty.delete(cid);setStatus();
  const c=BY_ID[cid], ent=entries[cid]||{itens:{}};
  const body={ka:c.ka,cnpj:c.cnpj,itens:JSON.parse(JSON.stringify(ent.itens||{})),updatedAt:new Date().toISOString(),updatedBy:myId||""};
  entries[cid]={...ent,updatedAt:body.updatedAt,updatedBy:body.updatedBy};
  try{await db.collection("mapa").doc(cid).set(body);errState=false;}
  catch(err){if(err&&(err.code==="invalid_argument"||err.code==="permission_denied"||err.code==="not_granted")){readOnly();renderView();}else{errState=true;dirty.add(cid);}}
  saving[cid]=false;setStatus();
}
async function saveTest(t){
  if(!db||!canWrite)return false;
  t.updatedAt=new Date().toISOString();t.updatedBy=myId||"";
  tests[t.id]={...t};tSaving++;setStatus();
  try{const {id,...body}=t;await db.collection("testes").doc(t.id).set(body);errState=false;return true;}
  catch(err){if(err&&(err.code==="invalid_argument"||err.code==="permission_denied"||err.code==="not_granted"))readOnly();else errState=true;return false;}
  finally{tSaving--;setStatus();}
}
async function deleteTest(id){
  if(!db||!canWrite)return;delete tests[id];tSaving++;setStatus();
  try{await db.collection("testes").doc(id).delete();}catch(e){errState=true;}finally{tSaving--;setStatus();}
}

function datalists(){
  const forn=new Map([["praso","Praso"]]);
  const marcas=SKUS.map(s=>new Map(s.pb.map(b=>[norm(b),b])));
  const sab=new Map(SABORES.map(v=>[norm(v),v]));
  for(const ent of Object.values(entries)){for(let i=0;i<SKUS.length;i++){const e=ent.itens?.[SKUS[i].code];if(!e)continue;
    if(e.forn&&!forn.has(norm(e.forn)))forn.set(norm(e.forn),e.forn.trim());
    if(e.marca&&!marcas[i].has(norm(e.marca)))marcas[i].set(norm(e.marca),e.marca.trim());}}
  document.getElementById("dl-forn").innerHTML=[...forn.values()].map(v=>`<option value="${esc(v)}">`).join("");
  document.getElementById("dl-sabor").innerHTML=[...sab.values()].map(v=>`<option value="${esc(v)}">`).join("");
  document.getElementById("dls").innerHTML=marcas.map((m,i)=>`<datalist id="dl-m-${i}">${[...m.values()].map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`).join("")
    +SKUS.map((s,i)=>`<datalist id="dl-pb-${i}">${s.pb.map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`).join("");
}

function calcHtml(cid,i){
  const r=calc(cid,i);
  if(r.e.jc&&!jcDrop(cid,i))return `<span class="chip good">Já compra conosco</span>${trendHtml(cid,i,false)}`;
  if(r.nu)return `<span class="chip neu">Cliente não usa</span>`;
  const ot=openTest(cid,i);
  const testBit=ot?`<span class="pill ${ot.status}">Teste ${esc(ot.marcaNova||"")} · ${fmtDate(ot.data)}</span>`
    :(canWrite&&(r.troca==="sim"||r.troca==="teste")?`<button class="btn sm primary" data-agendar="${cid}|${i}">Agendar teste</button>`:"");
  if(!r.hasVol)return `<span style="color:var(--muted)">Preencha embalagem e embalagens/mês para calcular</span>${trocaChip(r.troca)}${testBit}`;
  const u=unit(i);
  let chip="";
  if(r.diff!==null){const d=r.diff;
    chip=Math.abs(d)<0.02?`<span class="chip neu">Praso no mesmo preço</span>`
      :d<0?`<span class="chip good">Praso ${fmtN(-d*100,0)}% mais barata</span>`
      :`<span class="chip bad">Praso ${fmtN(d*100,0)}% mais cara</span>`;}
  return `<span>Fora da Praso: <b class="mono">${fmtVol(r.volFora,i)}/mês</b></span>
    ${r.precoU?`<span>Paga <b class="mono">${fmtBRL2(r.precoU)}/${u}</b></span>`:""}
    <span class="pot">${fmtBRL(r.pot)}/mês</span>${chip}${trocaChip(r.troca)}${testBit}`;
}

/* ===== Agregações ===== */
function itemAgg(i,clients){
  const x={i,s:SKUS[i],cli:0,nu:0,volFora:0,volPraso:0,pot:0,psum:0,pvol:0,cheaper:0,pricier:0,rTot:0,rPraso:0,tr:{sim:0,teste:0,nao:0,"":0},trVol:{sim:0,teste:0,nao:0,"":0}};
  for(const c of clients){const r=calc(c.id,i);
    x.volPraso+=r.volPraso;const pP=r.pb?r.pb.pkg:tablePkg(i);
    if(r.nu){x.nu++;continue;}
    if(!r.hasVol)continue;
    x.rPraso+=r.volPraso*pP;x.rTot+=r.volPraso*pP;
    x.cli++;x.volFora+=r.volFora;x.pot+=r.pot;x.rTot+=r.volFora*(r.precoU??pP);
    if(r.precoU){x.psum+=r.precoU*r.volFora;x.pvol+=r.volFora;if(r.diff< -0.02)x.cheaper++;else if(r.diff>0.02)x.pricier++;}
    x.tr[r.troca]++;x.trVol[r.troca]+=r.pot;}
  return x;
}
function brandAgg(i,clients){
  const m=new Map();
  for(const c of clients){const r=calc(c.id,i);if(r.nu||!r.hasVol)continue;
    const k=norm(r.e.marca)||"~";
    if(!m.has(k))m.set(k,{marca:(r.e.marca||"").trim()||"Marca não informada",cli:0,vol:0,pot:0,psum:0,pvol:0,min:Infinity,max:0,emb:new Set(),forn:new Map(),tr:{sim:0,teste:0,nao:0,"":0},sab:new Map()});
    const b=m.get(k);b.cli++;b.vol+=r.volFora;b.pot+=r.pot;b.emb.add(r.peso);b.tr[r.troca]++;
    if(r.precoU){b.psum+=r.precoU*r.volFora;b.pvol+=r.volFora;b.min=Math.min(b.min,r.precoU);b.max=Math.max(b.max,r.precoU);}
    if(r.e.forn&&!isPraso(r.e.forn))b.forn.set(norm(r.e.forn),r.e.forn.trim());
    if(i===RB&&r.e.sabor)for(const sb of String(r.e.sabor).split(/[,;/]| e /).map(v=>v.trim()).filter(Boolean))b.sab.set(norm(sb),sb);}
  return[...m.values()].sort((a,b)=>b.pot-a.pot);
}
function testsIn(filterFn){return Object.values(tests).filter(t=>BY_ID[t.cid]&&filterFn(t));}

  const box=document.getElementById("tlist");if(!box)return;

  const open=all.filter(t=>OPEN_ST.has(t.status)), soon=open.filter(t=>t.data&&t.data<=addDays(7));
  const appr=all.filter(t=>t.status==="aprovado"), rej=all.filter(t=>t.status==="reprovado");
  const potOpen=open.reduce((s,t)=>s+(t.potEst||0),0), potWon=appr.reduce((s,t)=>s+(t.potEst||0),0);
  const flt={open:t=>OPEN_ST.has(t.status),all:()=>true,aprovado:t=>t.status==="aprovado",reprovado:t=>t.status==="reprovado"||t.status==="cancelado"}[ui.tf];
  const list=all.filter(flt).sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const late=t=>OPEN_ST.has(t.status)&&t.status==="agendado"&&t.data&&t.data<today();
  box.innerHTML=`<div class="kpis" style="margin-top:16px">
      <div class="kpi hl"><span class="k">Testes em aberto</span><span class="v">${open.length}</span><span class="d">${soon.length} nos próximos 7 dias</span></div>

function sugHtml(i){const man=[],auto=new Map();
  for(const c of CLIENTS){const e=getE(c.id,i);if(e.sug&&String(e.sug).trim())man.push({c,e});const o=(e.nu||e.jc)?autoSugs(c.id)[i]:null;if(o&&!(e.sug&&String(e.sug).trim()))auto.set(o.label,(auto.get(o.label)||0)+1);}

  return `<p class="hint" style="margin-top:8px"><b>Sugestões de SKU</b> para quem já compra ou não usa este item: ${[...auto].sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${esc(k)} (${n} automática${n>1?"s":""})`).join(" · ")}${man.length?`${auto.size?" · ":""}${man.map(({c,e})=>`${esc(e.sug)} <span class="subtle">(KA ${esc(KAS[c.ka])} · ${esc(c.nome)})</span>`).join(" · ")}`:""}</p>`;}
function antHint(i){const l=Object.values(ants).filter(a=>a.item===SKUS[i].code);if(!l.length)return "";

  return `<p class="hint" style="margin-top:8px"><b>Antecipado fora da base:</b> ${l.length} clientes, ${fmtVol(vol,i)}/mês · ${[...br].map(([k,n])=>`${esc(k)} (${n})`).join(", ")}</p>`;}

  const vol=peso>0&&qtd>0?peso*qtd:0,pu=preco>0&&peso>0?preco/peso:null;return{i,vol,pu,pot:vol*(pu??(i>=0?tablePkg(i):0))};}

/* ===== CSV ===== */
function csv(){
  const head=["KA","Cliente","Razão social","CNPJ","Comprador","Item","Marca","Troca de marca","Sabor","Fornecedor atual","Embalagem","Unidade","Embalagens/mês","Preço embalagem (R$)","Não usa","Já compra conosco","Tendência na Praso","Sugestão de SKU","Volume fora/mês","Preço por unidade (R$)","Volume Praso/mês","Potencial R$/mês","Teste em aberto"];
  const lines=[head];
  for(const c of CLIENTS){for(let i=0;i<SKUS.length;i++){const r=calc(c.id,i);if(!rowInfo(c.id,i).have)continue;const ot=openTest(c.id,i);
    lines.push([KAS[c.ka],c.nome,c.razao,c.cnpj,BUYERS[SKUS[i].buyer],SKUS[i].nome,r.e.marca||"",TROCA_L[r.e.troca]||"",r.e.sabor||"",r.e.forn||"",r.peso>0?fmtN(r.peso,2):"",unit(i),r.qtd>0?fmtN(r.qtd,1):"",r.preco>0?fmtN(r.preco,2):"",r.e.nu?"sim":"",r.e.jc?"sim":"",trend(c.id,i)?.l||"",r.e.sug||((r.e.nu||r.e.jc)?(autoSugs(c.id)[i]?.label||""):""),fmtN(r.volFora,1),r.precoU?fmtN(r.precoU,2):"",fmtN(r.volPraso,1),fmtN(r.pot,2),ot?`${ot.marcaNova} ${fmtDate(ot.data)}`:""]);}}
  return "\ufeff"+lines.map(l=>l.map(v=>{v=String(v);return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}).join(";")).join("\n");
}

/* ===== Eventos ===== */
function startTest(cid,i){ui.tform=prefillAtual({cid,i:Number(i),marcaAtual:"",marcaNova:"",data:addDays(2),obs:""});setView("tests");window.scrollTo({top:0});}
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.view){setView(t.dataset.view);return;}
  if(t.dataset.ka){ui.ka=t.dataset.ka;if(ui.view==="buy")ui.view="sell";saveUi();ui.cur=ui.view==="fill"?null:ui.cur;if(ui.tform&&ui.view==="tests"&&ui.ka!=="all"&&BY_ID[ui.tform.cid]?.ka!==ui.ka)ui.tform=null;setView(ui.view);return;}
  if(t.dataset.buyer){ui.buyer=Number(t.dataset.buyer);saveUi();renderSegs();renderBuy();return;}
  if(t.dataset.cid){ui.cur=t.dataset.cid;saveUi();renderList();renderPanel();if(window.innerWidth<900)document.getElementById("panel").scrollIntoView({block:"start"});return;}
  if(t.dataset.open){ui.cur=t.dataset.open;if(ui.ka!=="all"&&BY_ID[ui.cur].ka!==ui.ka)ui.ka="all";setView("fill");window.scrollTo({top:0});return;}
  if(t.dataset.nav){const vis=visibleClients();const idx=vis.findIndex(x=>x.id===ui.cur);const n=vis[idx+Number(t.dataset.nav)];
    if(n){ui.cur=n.id;saveUi();renderList();renderPanel();const a=document.querySelector(`[data-cid="${n.id}"]`);a&&a.scrollIntoView({block:"nearest"});window.scrollTo({top:0});}return;}
  if(t.dataset.agendar){const[cid,i]=t.dataset.agendar.split("|");startTest(cid,i);return;}
  if(t.dataset.tfFilter){ui.tf=t.dataset.tfFilter;renderTestList();return;}
  if(t.dataset.tdel){if(t.dataset.armed){deleteTest(t.dataset.tdel);renderTestList();}else{t.dataset.armed="1";t.textContent="Confirmar";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="Excluir";}},3000);}return;}
  if(t.id==="tf-save"){const f=ui.tform;
    if(!f.cid||!String(f.marcaNova).trim()||!f.data){showNotice("Para agendar, escolha o cliente, a marca para testar e a data.");return;}
    const i=Number(f.i), r=calc(f.cid,i);
    const rec={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),cid:f.cid,ka:BY_ID[f.cid].ka,item:SKUS[i].code,marcaAtual:String(f.marcaAtual).trim(),marcaNova:String(f.marcaNova).trim(),data:f.data,status:"agendado",obs:String(f.obs).trim(),volEst:r.volFora||0,potEst:r.pot||0,createdAt:new Date().toISOString(),createdBy:myId||""};
    t.disabled=true;const ok=await saveTest(rec);t.disabled=false;
    if(ok){document.getElementById("notice").hidden=true;ui.tform={...prefillAtual({...tformDefault(),cid:f.cid,i}),marcaNova:""};ui.tf="open";renderTests();}
    return;}
  if(t.id==="af-save"){const f=ui.aform;
    if(!String(f.nome).trim()){showNotice("Para salvar, informe pelo menos o nome do cliente.");return;}
    const i=Number(f.i);const rec={id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nome:String(f.nome).trim(),cnpj:String(f.cnpj).trim(),tip:f.tip,ka:f.ka,item:SKUS[i].code,
      marca:String(f.marca).trim(),troca:f.troca,sabor:i===RB?String(f.sabor).trim():"",forn:String(f.forn).trim(),peso:f.peso,qtd:f.qtd,preco:f.preco,obs:String(f.obs).trim(),createdAt:new Date().toISOString(),createdBy:myId||""};
    t.disabled=true;const ok=await saveAnt(rec);t.disabled=false;
    if(ok){document.getElementById("notice").hidden=true;ui.aform={...aformDefault(),nome:f.nome,cnpj:f.cnpj,tip:f.tip,ka:f.ka};renderAnt();}
    return;}
  if(t.dataset.adel){if(t.dataset.armed){deleteAnt(t.dataset.adel);renderAntList();}else{t.dataset.armed="1";t.textContent="Confirmar";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="Excluir";}},3000);}return;}
  if(t.dataset.csv&&downloads){const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="mapa-share-ka-ce.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
});
function onField(ev){
  const inp=ev.target; const f=inp.dataset?.f; if(!f)return;
  const row=inp.closest(".row"); if(!row)return;
  const i=Number(row.dataset.i), cid=ui.cur, code=SKUS[i].code;
  if(!entries[cid])entries[cid]={itens:{}};
  if(!entries[cid].itens)entries[cid].itens={};
  const cur={...(entries[cid].itens[code]||{})};
  cur[f]=(f==="nu"||f==="jc")?inp.checked:inp.value;
  if(f==="nu"&&inp.checked)cur.jc=false;
  if(f==="jc"&&inp.checked)cur.nu=false;
  entries[cid].itens={...entries[cid].itens,[code]:cur};
  if(f==="nu"||f==="jc"){const y=window.scrollY;renderPanel();window.scrollTo({top:y});renderStrip();updateRing(cid);scheduleSave(cid);return;}
  refreshRow(cid,i); scheduleSave(cid);
}
const panel=document.getElementById("panel");
panel.addEventListener("input",e=>{if(e.target.type!=="checkbox")onField(e);});
panel.addEventListener("change",e=>{if(e.target.type==="checkbox")onField(e);});
const tv=document.getElementById("view-tests");
const av=document.getElementById("view-ant");
function onAf(e){const k=e.target.dataset?.af;if(!k||!ui.aform)return;ui.aform[k]=e.target.value;
  if(k==="i"){const box=document.getElementById("aform");if(box){box.innerHTML=aformBody();}return;}
  const inf=document.getElementById("af-info");if(inf)inf.innerHTML=aInfo();}
av.addEventListener("input",onAf);av.addEventListener("change",e=>{if(e.target.tagName==="SELECT")onAf(e);});
function onTf(e){const k=e.target.dataset?.tf;if(!k||!ui.tform)return;ui.tform[k]=e.target.value;
  if(k==="cid"||k==="i"){prefillAtual(ui.tform);const ma=document.getElementById("tf-ma");if(ma){ma.value=ui.tform.marcaAtual;ma.setAttribute("list","dl-m-"+ui.tform.i);}
    const mn=document.getElementById("tf-mn");if(mn)mn.setAttribute("list","dl-pb-"+ui.tform.i);}
  const inf=document.getElementById("tf-info");if(inf)inf.innerHTML=tformCalc(ui.tform);}
tv.addEventListener("input",onTf);tv.addEventListener("change",async e=>{onTf(e);
  const s=e.target.dataset?.tstatus, d=e.target.dataset?.tdate;
  if(s&&tests[s]){await saveTest({...tests[s],status:e.target.value});renderTestList();renderStrip();}
  if(d&&tests[d]&&e.target.value){await saveTest({...tests[d],data:e.target.value});renderTestList();}});
document.getElementById("q").addEventListener("input",e=>{ui.q=e.target.value;renderList();});
window.addEventListener("beforeunload",()=>{for(const cid of [...dirty]){clearTimeout(timers[cid]);flush(cid);}});

const okDomain=e=>/@praso\.com\.br$/i.test(String(e||"").trim());
function mapErr(e){const c=String(e?.code||"");return Object.assign(new Error(e?.message||"erro"),{code:(c==="42501"||/row-level security|permission/i.test(e?.message||""))?"permission_denied":c||"erro"});}
function makeDb(){return{collection(name){return{
  doc(id){return{
    async set(body){const {error}=await sb.from(name).upsert({id,body,updated_at:new Date().toISOString(),updated_by:myId});if(error)throw mapErr(error);},
    async delete(){const {error}=await sb.from(name).delete().eq("id",id);if(error)throw mapErr(error);}};},
  onSnapshot(cb,errcb){let t=null,fails=0;
    const load=async()=>{const {data,error}=await sb.from(name).select("id,body");
      if(error){if(++fails>=3&&errcb)errcb(error);return;}fails=0;cb({docs:(data||[]).map(r=>({id:r.id,data:()=>r.body}))});};
    load();
    sb.channel("rt-"+name).on("postgres_changes",{event:"*",schema:"public",table:name},()=>{clearTimeout(t);t=setTimeout(load,250);}).subscribe();
    setInterval(load,60000);}};}};}
function makeUser(u){const cache={};return{
  id:async()=>u.id,
  can:async()=>true,
  profiles:async(ids)=>{const need=ids.filter(i=>i&&!(i in cache));
    if(need.length){const {data}=await sb.from("perfis").select("id,nome,email").in("id",need.filter(x=>/^[0-9a-f-]{36}$/i.test(x)));for(const p of data||[])cache[p.id]={name:p.nome||p.email};for(const i of need)if(!(i in cache))cache[i]=null;}
    return Object.fromEntries(ids.map(i=>[i,cache[i]]));}};}

  gMsg.textContent="Enviando…";

let started=false;
async function start(session){
  if(started)return;
  const u=session?.user;
  if(!u){gate.hidden=false;return;}
  if(!okDomain(u.email)){gate.hidden=false;gMsg.textContent="Este painel é só para e-mails @praso.com.br.";await sb.auth.signOut();return;}
  started=true;gate.hidden=true;
  const nome=u.user_metadata?.full_name||u.user_metadata?.name||u.email.split("@")[0];
  document.getElementById("userName").textContent=nome;document.getElementById("userbox").hidden=false;
  try{await sb.from("perfis").upsert({id:u.id,nome,email:u.email,updated_at:new Date().toISOString()});}catch(e){}
  downloads=true;
  userApi=makeUser(u);myId=u.id;
  db=makeDb();dbTried=true;setStatus();renderView();
  const busy=()=>{const a=document.activeElement;return a&&(panel.contains(a)||tv.contains(a)||av.contains(a))&&/INPUT|SELECT|TEXTAREA/.test(a.tagName);};
  let first=true;
  db.collection("mapa").onSnapshot(snap=>{
    let curChanged=false;
    for(const d of snap.docs){const cid=d.id; if(!BY_ID[cid]||dirty.has(cid)||saving[cid])continue;
      const data=d.data()||{}; const prev=entries[cid];
      if(!prev||prev.updatedAt!==data.updatedAt){entries[cid]={itens:data.itens||{},updatedAt:data.updatedAt,updatedBy:data.updatedBy};if(cid===ui.cur)curChanged=true;}}
    renderStrip();
    if(ui.view==="fill"){renderList();if(first||(curChanged&&!busy()))renderPanel();}
    else if(ui.view==="tests"){if(!busy())renderTests();}
    else renderView();
    first=false;
  },err=>{showNotice("A conexão com os dados caiu. Recarregue a página para continuar salvando.");db=null;setStatus();});
  db.collection("antecipar").onSnapshot(snap=>{
    const next={};for(const d of snap.docs)next[d.id]={...(d.data()||{}),id:d.id};ants=next;
    if(ui.view==="ant")renderAntList();else if(ui.view==="buy")renderBuy();
  },err=>{});
  db.collection("testes").onSnapshot(snap=>{
    const next={};for(const d of snap.docs)next[d.id]={...(d.data()||{}),id:d.id};tests=next;
    if(ui.view==="tests")renderTestList();
    else if(ui.view==="fill"){if(!busy())renderPanel();}
    else renderView();
  },err=>{});
}
sb.auth.getSession().then(({data})=>start(data.session));
sb.auth.onAuthStateChange((ev,session)=>{if(session)start(session);});
